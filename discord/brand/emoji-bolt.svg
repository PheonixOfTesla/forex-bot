<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>bolt</title>
  <!-- Emoji render at 32px in-line. No gradients finer than two stops,
       no strokes under 2px, or it turns to mush. -->
  <defs>
    <linearGradient id="g" x1="40%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFE68A"/>
      <stop offset="100%" stop-color="#D9A916"/>
    </linearGradient>
  </defs>
  <path d="M 76 8 L 30 68 L 58 68 L 46 120 L 100 54 L 70 54 Z"
        fill="url(#g)" stroke="#8C6410" stroke-width="4"
        stroke-linejoin="round"/>
</svg>
