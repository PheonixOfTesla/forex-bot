<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>star</title>
  <!-- Four-point sparkle rather than a five-point star: the concave
       curves survive the downscale to 32px where a classic star's thin
       points disappear. -->
  <defs>
    <radialGradient id="g" cx="50%" cy="42%" r="60%">
      <stop offset="0%"   stop-color="#FFF6D8"/>
      <stop offset="55%"  stop-color="#E8B923"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="46" fill="#E8B923" opacity="0.18"/>
  <path d="M 64 6
           C 70 40 88 58 122 64
           C 88 70 70 88 64 122
           C 58 88 40 70 6 64
           C 40 58 58 40 64 6 Z"
        fill="url(#g)" stroke="#8C6410" stroke-width="3.5"
        stroke-linejoin="round"/>
</svg>
