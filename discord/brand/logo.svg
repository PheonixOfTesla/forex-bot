<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Nebula</title>

  <defs>
    <!-- Deep field. Violet bias so the gold reads warm against it. -->
    <radialGradient id="space" cx="38%" cy="30%" r="92%">
      <stop offset="0%"   stop-color="#241B3D"/>
      <stop offset="46%"  stop-color="#150F26"/>
      <stop offset="100%" stop-color="#070510"/>
    </radialGradient>

    <radialGradient id="cloudA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#A855F7" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cloudB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F472B6" stop-opacity="0.85"/>
      <stop offset="60%"  stop-color="#DB2777" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#DB2777" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cloudC" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#B8860B"/>
      <stop offset="45%"  stop-color="#E8B923"/>
      <stop offset="100%" stop-color="#FFE68A"/>
    </linearGradient>

    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <filter id="trail" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#space)"/>

  <!-- Nebula body. Three offset clouds instead of one so the color
       transitions are uneven the way real gas is; a single symmetric
       blob reads as a lens flare. Clipped to the tile radius. -->
  <g clip-path="inset(0 round 228px)">
    <g filter="url(#soften)">
      <ellipse cx="410" cy="430" rx="290" ry="230" fill="url(#cloudA)"/>
      <ellipse cx="650" cy="520" rx="240" ry="200" fill="url(#cloudB)"/>
      <ellipse cx="520" cy="330" rx="200" ry="150" fill="url(#cloudC)"/>
    </g>
  </g>

  <!-- Star field. Sizes vary or it looks like screen dirt. -->
  <g fill="#FFFFFF">
    <circle cx="188" cy="212" r="4.5" opacity="0.85"/>
    <circle cx="286" cy="150" r="2.5" opacity="0.55"/>
    <circle cx="840" cy="252" r="4"   opacity="0.75"/>
    <circle cx="760" cy="168" r="2.5" opacity="0.5"/>
    <circle cx="152" cy="560" r="3"   opacity="0.6"/>
    <circle cx="896" cy="616" r="3.5" opacity="0.65"/>
    <circle cx="238" cy="762" r="2.5" opacity="0.5"/>
    <circle cx="792" cy="828" r="3"   opacity="0.55"/>
    <circle cx="606" cy="196" r="2"   opacity="0.45"/>
    <circle cx="404" cy="840" r="2.5" opacity="0.5"/>
  </g>

  <!-- The constellation: an ascending line whose vertices are stars.
       This is the whole idea of the mark: a trend line drawn in the
       sky. It is the only gold element, so it wins at any size. -->
  <g filter="url(#trail)">
    <polyline points="212,742 366,660 494,700 632,506 776,398 872,306"
              fill="none" stroke="url(#gold)" stroke-width="17"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#FFF6D8" stroke="#E8B923" stroke-width="5">
    <circle cx="212" cy="742" r="15"/>
    <circle cx="366" cy="660" r="13"/>
    <circle cx="494" cy="700" r="13"/>
    <circle cx="632" cy="506" r="15"/>
    <circle cx="776" cy="398" r="13"/>
  </g>

  <!-- Terminal star, oversized: the destination of the trend -->
  <circle cx="872" cy="306" r="30" fill="#FFE68A" opacity="0.28"/>
  <circle cx="872" cy="306" r="19" fill="#FFF6D8"
          stroke="#E8B923" stroke-width="6"/>

  <rect x="6" y="6" width="1012" height="1012" rx="224"
        fill="none" stroke="#E8B923" stroke-opacity="0.22" stroke-width="3"/>
</svg>
