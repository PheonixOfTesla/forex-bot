version: '3.8'
services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    networks:
      - forex-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file: ../.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      - ../logs:/app/logs
    networks:
      - forex-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    container_name: forex-postgres
    environment:
      POSTGRES_USER: lightning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lightning_secret}
      POSTGRES_DB: lightning_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - forex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightning -d lightning_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forex-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - forex-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  forex-network:
    driver: bridge
